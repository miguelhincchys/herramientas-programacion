<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi galería · Clase 3</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1>Mi galería de imágenes</h1>

  <figure>
    <img src="https://previews.123rf.com/images/bubertart/bubertart2303/bubertart230301083/200841474-boy-chef-cooking-food-in-the-kitchen-cartoon-illustration-for-children-s-book-ai-generative.jpg" alt="Niño chef cocinando en una cocina">
    <figcaption>Un niño cocinando.</figcaption>
  </figure>

  <figure>
    <img src="https://artwork.art-cdn.com/18026/cc-dibujo-noche-estrellada-van-gogh.jpg" alt="La noche estrellada de Vincent van Gogh">
    <figcaption>La noche estrellada.</figcaption>
  </figure>

  <figure>
    <img src="https://cdn.sanity.io/images/5vm5yn1d/pro/e8901b37029ada974f945ce569a5643b511fb4a9-1499x1000.jpg?fm=webp&q=80" alt="Gato sentado">
    <figcaption>Un gato.</figcaption>
  </figure>

  <h2>Mis materias</h2>

  <table>
    <thead>
      <tr>
        <th>Materia</th>
        <th>Horario</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Matemáticas</td>
        <td>Lunes 7:00 a.m.</td>
      </tr>

      <tr>
        <td>Tecnología</td>
        <td>Miércoles 9:00 a.m.</td>
      </tr>

      <tr>
        <td>Inglés</td>
        <td>Viernes 8:00 a.m.</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
